name: iPhone build checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Tests and builds for iPhone and Simulator
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Test the bridge and report delivery
        run: python3 -m unittest discover -s bridge -v

      - name: Test Swift core and build the simulator app
        run: sh scripts/check-macos.sh

      - name: Package the unsigned simulator app
        run: |
          test -d build/Build/Products/Debug-iphonesimulator/Orbit.app
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/Orbit.app \
            build/artifacts/Orbit-simulator-unsigned.zip

      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-simulator-unsigned
          path: build/artifacts/Orbit-simulator-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build and package the iPhone IPA for personal signing
        run: |
          xcodebuild -project AgentOrbit.xcodeproj -scheme Orbit \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          app="build/Build/Products/Release-iphoneos/Orbit.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = "iPhoneOS"
          xcrun lipo "$app/Orbit" -verify_arch arm64
          xcrun vtool -show-build "$app/Orbit" | grep -E 'platform[[:space:]]+IOS$'
          payload="$RUNNER_TEMP/orbit-device/Payload"
          mkdir -p "$payload"
          ditto "$app" "$payload/Orbit.app"
          ditto -c -k --norsrc --noextattr --keepParent "$payload" build/artifacts/Orbit.ipa
          unzip -tq build/artifacts/Orbit.ipa

      - name: Upload the iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-iPhone
          path: build/artifacts/Orbit.ipa
          if-no-files-found: error
          retention-days: 7
